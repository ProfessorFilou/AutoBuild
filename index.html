<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder – ProfessorFilou</title>
<link rel="icon" href="../ProfessorFilouLOGO.jpg">
<style>
@property --g1{syntax:'<color>';inherits:false;initial-value:#f2f5f9}
@property --g2{syntax:'<color>';inherits:false;initial-value:#f2f5f9}
@property --oc{syntax:'<color>';inherits:false;initial-value:#667088}
:root{--bg:#060810;--glass:rgba(255,255,255,.045);--border:rgba(255,255,255,.09);--cyan:#00ffcc;--text:#f2f5f9;--dim:#9099ac;--faint:#525a6a}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding:10px;gap:8px}
.top{position:relative;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--glass);border:1px solid var(--border);border-radius:14px;font-size:12px;color:var(--dim);overflow:hidden}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
#status{margin-left:auto;color:var(--cyan)}
#prog{position:absolute;left:0;bottom:0;height:2px;width:0;background:linear-gradient(90deg,#00ffcc,#2fd8ff,#8b7bff,#ff6bcb);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.stage{position:relative;flex:1;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg)}
.orb{--oc:#667088;position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:screen;opacity:0;background:radial-gradient(circle,var(--oc),transparent 70%);transition:opacity 1.4s,--oc 1.1s}
#pg{position:relative;z-index:1;transform-origin:top left;padding:24px 14px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.nx{visibility:hidden}
.rv{animation:rv .9s cubic-bezier(.2,.8,.2,1)}
@keyframes rv{from{opacity:0;filter:blur(14px);transform:translateY(12px) scale(.96)}to{opacity:1;filter:blur(0);transform:none}}
.gl{filter:drop-shadow(0 0 calc(var(--glow,0)*24px) var(--gc,#00ffcc))}
.v{font-weight:inherit}.gh{visibility:hidden;font-weight:inherit}
.caret .v::after{content:"";display:inline-block;width:2px;height:1em;background:#fff;margin-left:2px;vertical-align:-.12em;animation:bl .5s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
h1{display:flex;align-items:center;justify-content:center;white-space:pre;font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:clamp(30px,8vw,76px);line-height:1.1;padding:0 8px}
h1 span{--g1:#f2f5f9;--g2:#f2f5f9;background-image:linear-gradient(100deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:--g1 1s,--g2 1s}
#bot{width:.95em;height:.95em;border-radius:50%;background:#2a3040;position:relative;flex-shrink:0;margin:0 -.02em;transition:background .8s}
#bot i{position:absolute;top:34%;width:15%;height:30%;border-radius:8px;background:#000;transition:height .15s,top .15s}
#bot i:nth-child(1){left:24%}#bot i:nth-child(2){right:24%}
#bot.happy i{height:12%;top:42%}
.line{width:min(220px,60vw);height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,#00ffcc,transparent)}
.txt{color:var(--dim);font-size:clamp(14px,3.3vw,18px)}
.socials{display:flex;gap:12px;margin-top:22px}
.social{width:clamp(48px,11vw,60px);height:clamp(48px,11vw,60px);border-radius:16px;background:var(--glass);border:1px solid var(--border);display:grid;place-items:center;color:var(--text);transition:color .8s,border-radius .2s}
.social svg{width:44%;height:44%}
.ptr{margin-top:36px;display:flex;align-items:center;gap:12px}
.ptitle{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:clamp(19px,4.4vw,27px)}
.dice{width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--glass);display:grid;place-items:center;color:var(--cyan)}
.dice svg{width:19px;height:19px}
.grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:100%;max-width:900px}
.pb{padding:16px 10px 13px;border-radius:20px;background:var(--glass);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--text);min-height:78px}
.pb svg{width:26px;height:26px;color:var(--dim);transition:color .8s}
.pb svg,.social svg{opacity:0}
.ic svg{opacity:1}
.pb svg *,.social svg *{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s ease}
.ic svg *{stroke-dashoffset:0}
.links,.copy{font-size:13px;color:var(--faint)}
.links{margin-top:28px}.copy{margin-top:10px}
.stats{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{padding:12px 16px;min-width:150px;border-radius:16px;background:var(--glass);border:1px solid var(--border);text-align:left}
.stat b{display:block;font-family:'Space Grotesk',Inter,sans-serif;font-size:16px;color:var(--cyan)}
.stat small{font-size:11px;color:var(--faint)}
/* Analyse-Glow (Shimmer) */
.scan{position:fixed;z-index:35;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .35s;background:rgba(255,255,255,.035);box-shadow:0 0 0 1px rgba(255,255,255,.2),0 0 38px rgba(0,255,204,.28),inset 0 0 30px rgba(0,255,204,.1);animation:pulse 1.4s ease-in-out infinite}
.scan.on{opacity:1}
.scan::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{to{transform:translateX(100%)}}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,255,255,.3),0 0 56px rgba(139,123,255,.38),inset 0 0 40px rgba(139,123,255,.14)}}
.scan em{position:absolute;left:12px;top:9px;font:600 12px Inter,sans-serif;font-style:normal;color:transparent;background:linear-gradient(90deg,#6b7385 0%,#fff 50%,#6b7385 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;animation:shm 1.3s linear infinite;white-space:nowrap}
@keyframes shm{from{background-position:200% 0}to{background-position:-200% 0}}
/* Auswahl */
.sel{position:fixed;z-index:36;pointer-events:none;border:1.5px solid #00ffcc;opacity:0;transform:scale(1.03);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 0 18px rgba(0,255,204,.25)}
.sel.on{opacity:1;transform:none}
.sel i{position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid #00ffcc;border-radius:2px}
.sel i:nth-child(1){left:-4px;top:-4px}.sel i:nth-child(2){right:-4px;top:-4px}.sel i:nth-child(3){left:-4px;bottom:-4px}.sel i:nth-child(4){right:-4px;bottom:-4px}
.sel em{position:absolute;left:-1px;bottom:100%;margin-bottom:7px;font:600 10px Inter,sans-serif;font-style:normal;background:#00ffcc;color:#04100d;padding:3px 8px;border-radius:6px;white-space:nowrap}
/* Editor (slide in / out) */
.ed{position:fixed;z-index:60;right:18px;top:74px;width:252px;padding:14px;border-radius:20px;background:rgba(14,18,32,.82);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 40px rgba(0,255,204,.08);transform:translateX(130%) scale(.96);opacity:0;transition:transform .65s cubic-bezier(.2,.9,.25,1.08),opacity .4s}
.ed.open{transform:none;opacity:1}
.ed-h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px}
.ed-h i{width:8px;height:8px;border-radius:50%;background:#00ffcc;box-shadow:0 0 10px #00ffcc}
.ed-h span{margin-left:auto;color:var(--faint)}
.ed-s{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin:4px 0 8px}
.sws{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:10px;border:2px solid transparent;transition:transform .2s,border-color .2s,box-shadow .2s}
.sw.on{border-color:#fff;transform:scale(1.14);box-shadow:0 0 14px currentColor}
.rowx{margin-top:14px}
.rowx label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:8px}
.trk{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.1)}
.trk u{position:absolute;left:0;top:0;height:100%;border-radius:9px;background:linear-gradient(90deg,#00ffcc,#8b7bff)}
.trk s{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.done{margin-top:16px;width:100%;padding:10px;border-radius:12px;border:1px solid rgba(0,255,204,.5);background:rgba(0,255,204,.08);color:#00ffcc;font-weight:600;font-size:13px;transition:transform .15s,background .2s}
.done.hot{background:rgba(0,255,204,.25);transform:scale(.97)}
/* Cursor */
.cur{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:opacity .5s;will-change:transform}
.cur svg{width:26px;height:26px;filter:drop-shadow(0 0 8px rgba(0,255,204,.6)) drop-shadow(0 2px 3px rgba(0,0,0,.6));transition:transform .12s}
.cur.down svg{transform:scale(.78)}
.rip{position:fixed;z-index:99;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #00ffcc;pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(4.5);opacity:0}}
#again{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:70;padding:11px 22px;border-radius:999px;border:1px solid var(--cyan);background:rgba(6,8,16,.9);color:var(--cyan);font-weight:600;cursor:pointer}
#again.show{display:block}
@media(max-width:600px){.ed{left:10px;right:10px;top:auto;bottom:10px;width:auto;transform:translateY(130%) scale(.96)}.ed.open{transform:none}}
</style>
</head>
<body>
<svg style="display:none"><defs>
<g id="i-github"><path d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.8 9.6.5.1.7-.2.7-.5v-1.9c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1.1 1.5 1.1.9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.3-.3-4.6-1.1-4.6-5.1 0-1.1.4-2 1.1-2.8-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 2.9 1.1a10 10 0 0 1 5.3 0c2-1.4 2.9-1.1 2.9-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.7 1.1 2.8 0 4-2.3 4.8-4.6 5.1.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10.1 10.1 0 0 0 22 12.2C22 6.6 17.5 2 12 2Z"/></g>
<g id="i-discord"><path d="M19.3 5.2A16.6 16.6 0 0 0 15.1 4l-.3.6a14.5 14.5 0 0 1 3.5 1.4 15 15 0 0 0-13.2 0A14.5 14.5 0 0 1 8.6 4.6L8.3 4a16.6 16.6 0 0 0-4.2 1.2C1.7 9.3.9 13.3 1.2 17.2a16.7 16.7 0 0 0 5.1 2.6l.7-1.1a10.8 10.8 0 0 1-1.7-.8l.4-.3a12 12 0 0 0 10.6 0l.4.3c-.5.3-1.1.6-1.7.8l.7 1.1a16.7 16.7 0 0 0 5.1-2.6c.4-4.4-.6-8.3-2.5-12z"/></g>

<g id="i-probuilder"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>
<g id="i-chat"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H9l-4.5 4v-4H4A1.5 1.5 0 0 1 2.5 15V7A1.5 1.5 0 0 1 4 5.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></g>
<g id="i-click"><circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01"/><path d="M7.5 14.5c1 1.6 2.7 2.5 4.5 2.5s3.5-.9 4.5-2.5"/></g>

<g id="i-pong"><rect x="2.5" y="4" width="19" height="16" rx="2"/><line x1="6" y1="9" x2="6" y2="13"/><line x1="18" y1="11" x2="18" y2="15"/><path d="M12 12h.01"/></g>

</defs></svg>

<div class="app">
  <div class="top"><span class="dots"><i></i><i></i><i></i></span><span>editor · professorfilou.de</span><span id="status"></span><div id="prog"></div></div>
  <div class="stage" id="stage">
    <div class="orb nx" id="o1" style="width:44%;height:60%;left:-10%;top:-14%"></div>
    <div class="orb nx" id="o2" style="width:38%;height:55%;right:-12%;top:10%"></div>
    <div class="orb nx" id="o3" style="width:40%;height:55%;left:20%;bottom:-18%"></div>
    <div id="pg">
      <h1 id="h1"><span id="s1" class="nx" data-t="Profess"></span><div id="bot" class="nx"><i></i><i></i></div><span id="s2" class="nx" data-t="rFilou"></span></h1>
      <div class="line nx" id="line"></div>
      <div class="txt nx" id="mc" data-t="❤️ Minecraft"></div>
      <div class="socials" id="socials"></div>
      <div class="ptr"><div class="ptitle nx" id="pt" data-t="My Projects"></div><div class="dice nx" id="dice"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.8"/><circle cx="8.2" cy="8.2" r="1.35" fill="currentColor"/><circle cx="15.8" cy="8.2" r="1.35" fill="currentColor"/><circle cx="12" cy="12" r="1.35" fill="currentColor"/><circle cx="8.2" cy="15.8" r="1.35" fill="currentColor"/><circle cx="15.8" cy="15.8" r="1.35" fill="currentColor"/></svg></div></div>
      <div class="grid" id="grid"></div>
      <div class="links nx" id="links" data-t="Kontakt  ·  Impressum"></div>

      <div class="stats" id="stats"></div>
    </div>
  </div>
</div>

  <div class="ed-h"><i></i><b id="ed-name">Element</b><span>✕</span></div>
  <div class="ed-s">Füllung</div>
  <div class="sws" id="sws"></div>
  <div class="rowx" id="r-glow"><label>Glow</label><div class="trk"><u></u><s></s></div></div>

</div>

<button id="again" type="button">↻ Nochmal bauen</button>

<script>
const C={cyan:"#00ffcc",blue:"#2fd8ff",violet:"#8b7bff",pink:"#ff6bcb",gold:"#ffd56a",white:"#f2f5f9",gray:"#9099ac"};
const SOC=["github","discord","youtube","twitch"];
const PROJ=[["probuilder","ProBuilder"],["chat","Chat"],["click","Click"],["quiz","Quiz"],["pong","Pong"],["terminal","Terminal"],["radio","Radio"],["convert","Convert"]];
const STAT=[["1.337","Besuche gesamt"],["42 Tage","Seite online"]];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n,cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const stage=$("stage"),ed=$("ed"),cur=$("cur"),TPL=stage.innerHTML;
let pos={x:-40,y:innerHeight+40},run=0;
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${n}"/></svg>`;

/* ── Aufbau / Reset ── */
function reset(){
  stage.innerHTML=TPL;
  $("socials").innerHTML=SOC.map(s=>`<a class="social nx">${ico(s)}</a>`).join("");
  $("grid").innerHTML=PROJ.map(([i,l])=>`<div class="pb nx">${ico(i)}<span data-t="${l}"></span></div>`).join("");
  $("stats").innerHTML=STAT.map(([v,l])=>`<div class="stat nx"><b data-t="${v}"></b><small>${l}</small></div>`).join("");
  stage.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=`<b class="v"></b><b class="gh">${e.dataset.t}</b>`);
  stage.querySelectorAll(".social svg *,.pb svg *").forEach(e=>e.setAttribute("pathLength","1"));
  $("sws").innerHTML=[C.cyan,C.blue,C.violet,C.pink,C.gold,C.white,C.gray].map(c=>`<div class="sw" data-k="${c}" style="background:${c};color:${c}"></div>`).join("")+
    [["site","linear-gradient(90deg,#00ffcc,#2fd8ff,#8b7bff,#ff6bcb)"],[C.cyan+","+C.violet,`linear-gradient(135deg,${C.cyan},${C.violet})`],[C.pink+","+C.gold,`linear-gradient(135deg,${C.pink},${C.gold})`]].map(([k,g])=>`<div class="sw" data-k="${k}" style="background:${g}"></div>`).join("");
  fit();
}
function fit(){
  const pg=$("pg");if(!pg)return;
  pg.style.width="100%";pg.style.transform="none";
  const s=Math.min(1,(stage.clientHeight-8)/pg.offsetHeight);
  pg.style.width=(100/s)+"%";pg.style.transform=`scale(${s})`;
}
addEventListener("resize",fit);

/* ── Cursor ── */
const T=p=>`translate(${p.x-5}px,${p.y-3}px)`;
async function glide(x,y,d){
  const f={...pos},dx=x-f.x,dy=y-f.y,dist=Math.hypot(dx,dy);
  if(dist<2)return;
  const dur=d||Math.min(1100,380+dist),arc=Math.min(70,dist*.14)*(Math.random()<.5?-1:1);
  const m={x:f.x+dx/2-dy/dist*arc,y:f.y+dy/2+dx/dist*arc};
  const a=cur.animate([{transform:T(f)},{transform:T(m)},{transform:T({x,y})}],{duration:dur,easing:"cubic-bezier(.45,.05,.2,1)",fill:"forwards"});
  await a.finished;pos={x,y};cur.style.transform=T(pos);a.cancel();
}
const ctr=(el,k=.3)=>{const r=el.getBoundingClientRect();return{x:r.left+r.width*(.5-k/2+rnd(k)),y:r.top+r.height*(.5-k/2+rnd(k))}};
const goEl=async(el,d)=>{const p=ctr(el);await glide(p.x,p.y,d)};
async function click(){
  const r=document.createElement("div");r.className="rip";r.style.left=pos.x+"px";r.style.top=pos.y+"px";document.body.append(r);
  setTimeout(()=>r.remove(),650);cur.classList.add("down");await sleep(130);cur.classList.remove("down");await sleep(80);
}

/* ── Analyse-Glow ── */
function mkScan(r,label,rad=16){
  const s=document.createElement("div");s.className="scan";
  s.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${rad}px`;
  if(label&&r.width>120)s.innerHTML=`<em>${label}</em>`;
  document.body.append(s);requestAnimationFrame(()=>s.classList.add("on"));return s;
}
const fade=(s,ms=400)=>{s.classList.remove("on");setTimeout(()=>s.remove(),ms)};
const reveal=el=>{el.classList.remove("nx");el.classList.add("rv")};
async function scanReveal(el,label,ms=650){
  const s=mkScan(el.getBoundingClientRect(),label);await sleep(ms);reveal(el);await sleep(140);fade(s);
}
async function sweep(els,label,per=0){
  const ps=[];
  for(let i=0;i<els.length;i++){
    await goEl(els[i],per||undefined);
    ps.push(scanReveal(els[i],i?"":label,600));
  }
  await Promise.all(ps);
}
async function type(el,sp=28){
  const v=el.querySelector(".v"),g=el.querySelector(".gh"),f=el.dataset.t;
  el.classList.add("caret");
  for(let i=1;i<=f.length;i++){v.textContent=f.slice(0,i);g.textContent=f.slice(i);await sleep(sp+rnd(sp))}
  el.classList.remove("caret");
}

/* ── Editor ── */
const clipR=r=>{const s=stage.getBoundingClientRect(),l=Math.max(r.left,s.left),t=Math.max(r.top,s.top);return{left:l,top:t,width:Math.min(r.right,s.right)-l,height:Math.min(r.bottom,s.bottom)-t}};
function mkSel(el,name){
  const big=el===stage;
  let r=clipR(el.getBoundingClientRect());
  if(big)r={left:r.left+5,top:r.top+5,width:r.width-10,height:r.height-10};
  const d=document.createElement("div");d.className="sel";
  d.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;border-radius:${big?14:8}px`;
  d.innerHTML="<i></i><i></i><i></i><i></i>"+(name?`<em>${name}</em>`:"");
  document.body.append(d);requestAnimationFrame(()=>d.classList.add("on"));return d;
}
function setRow(id,v){const r=$(id);r.querySelector("u").style.width=v*100+"%";r.querySelector("s").style.left=v*100+"%"}
async function drag(id,to,fn){
  const row=$(id),trk=row.querySelector(".trk"),knob=row.querySelector("s");
  await goEl(knob,500);await click();cur.classList.add("down");
  const tr=trk.getBoundingClientRect(),tx=tr.left+tr.width*to,y=tr.top+tr.height/2;
  let go=true;const p=glide(tx,y,900).then(()=>go=false);
  (function tick(){
    const x=cur.getBoundingClientRect().left+5,v=cl((x-tr.left)/tr.width,0,1);
    setRow(id,v);fn(v);if(go)requestAnimationFrame(tick);
  })();
  await p;cur.classList.remove("down");setRow(id,to);fn(to);await sleep(200);
}
async function edit(o){
  const c0=o.els[0];
  await goEl(c0===stage?stage:c0,900);await click();
  const sels=o.els.map((e,i)=>mkSel(e,i?"":o.name));
  $("ed-name").textContent=o.name;
  $("r-glow").style.display=o.glow?"":"none";$("r-rad").style.display=o.rad?"":"none";
  setRow("r-glow",o.gv??.3);setRow("r-rad",o.rv??.35);
  document.querySelectorAll(".sw").forEach(s=>s.classList.remove("on"));
  await sleep(200);ed.classList.add("open");await sleep(750);
  const sw=ed.querySelector(`[data-k="${o.sw}"]`);
  await goEl(sw,650);await click();sw.classList.add("on");o.apply(o.sw);await sleep(500);
  if(o.glow){await drag("r-glow",o.gt??.75,o.glow)}
  if(o.rad){await drag("r-rad",o.rt??.7,o.rad)}
  const dn=$("done");await goEl(dn,600);dn.classList.add("hot");await click();dn.classList.remove("hot");
  ed.classList.remove("open");sels.forEach(s=>s.classList.remove("on"));
  await sleep(650);sels.forEach(s=>s.remove());
}

/* ── Drehbuch ── */
async function script(id){
  const ok=()=>id===run,S=n=>{$("prog").style.width=n/8*100+"%"};
  const orbs=["o1","o2","o3"].map($);
  cur.style.opacity=1;await sleep(600);

  /* 1 Hintergrund */
  let sr=stage.getBoundingClientRect();
  await glide(sr.left+sr.width*.5,sr.top+sr.height*.45,1100);
  let sc=mkScan({left:sr.left+6,top:sr.top+6,width:sr.width-12,height:sr.height-12},"Analysiere Layout …",14);
  await sleep(1300);orbs.forEach(o=>{o.classList.remove("nx");o.style.opacity=.2});await sleep(400);fade(sc);S(1);
  await edit({els:[stage],name:"Hintergrund",sw:C.cyan+","+C.violet,gv:.2,gt:.7,
    apply:k=>{const[a,b]=k.split(",");orbs[0].style.setProperty("--oc",a);orbs[1].style.setProperty("--oc",b);orbs[2].style.setProperty("--oc",C.blue)},
    glow:v=>orbs.forEach(o=>o.style.opacity=.1+v*.32)});
  if(!ok())return;

  /* 2 Titel */
  const h1=$("h1"),s1=$("s1"),s2=$("s2"),bot=$("bot");
  await goEl(h1,900);
  await Promise.all([scanReveal(s1,"Generiere Titel …",900),scanReveal(bot,"",900),scanReveal(s2,"",900)]);
  await Promise.all([type(s1,20),type(s2,20)]);S(2);
  await edit({els:[s1,bot,s2],name:"Titel",sw:"site",gv:.1,gt:.6,
    apply:()=>{s1.style.setProperty("--g1",C.cyan);s1.style.setProperty("--g2",C.blue);s2.style.setProperty("--g1",C.violet);s2.style.setProperty("--g2",C.pink);bot.style.background=C.blue},
    glow:v=>{h1.classList.add("gl");h1.style.setProperty("--glow",v)}});
  if(!ok())return;

  /* 3 Linie + Text */
  await sweep([$("line"),$("mc")],"Füge Text hinzu …");await type($("mc"),30);S(3);

  /* 4 Socials */
  const soc=[...$("socials").children];
  await sweep(soc,"Erzeuge Buttons …",420);
  await edit({els:soc,name:"Social Icons",sw:C.gray,rv:.33,rt:.85,
    apply:k=>soc.forEach(e=>{e.style.color=k;e.classList.add("ic")}),
    rad:v=>soc.forEach(e=>e.style.borderRadius=(8+v*24)+"px")});
  S(4);if(!ok())return;

  /* 5 Projekte-Titel */
  await sweep([$("pt"),$("dice")],"Neuer Abschnitt …");await type($("pt"),28);S(5);

  /* 6 Projekt-Kacheln */
  const tiles=[...$("grid").children];
  await sweep(tiles,"Erzeuge Projekte …",430);
  await Promise.all(tiles.map(t=>type(t.querySelector("[data-t]"),16)));
  await edit({els:tiles,name:"Projekt-Kacheln",sw:C.cyan,rv:.55,rt:.8,
    apply:k=>tiles.forEach(t=>{t.querySelector("svg").style.color=k;t.classList.add("ic")}),
    rad:v=>tiles.forEach(t=>t.style.borderRadius=(10+v*22)+"px")});
  S(6);if(!ok())return;

  /* 7 Footer + Stats */
  const foot=[$("links"),$("copy"),...$("stats").children];
  await sweep(foot,"Fülle Footer …",420);
  await Promise.all(foot.map(e=>e.dataset.t?type(e,20):type(e.querySelector("[data-t]"),40)));S(7);

  /* 8 Finale */
  await goEl(bot,1000);await click();bot.classList.add("happy");
  await sleep(1300);bot.classList.remove("happy");S(8);
  $("status").textContent="Fertig ✓";
  await glide(innerWidth+60,innerHeight*.3,1200);cur.style.opacity=0;
  $("again").classList.add("show");
}
async function start(){
  const id=++run;
  document.querySelectorAll(".scan,.sel,.rip").forEach(e=>e.remove());
  ed.classList.remove("open");$("again").classList.remove("show");$("status").textContent="";$("prog").style.width="0";
  reset();cur.style.opacity=0;pos={x:-40,y:innerHeight*.7};cur.style.transform=T(pos);
  script(id);
}
$("again").onclick=start;
start();
</script>
</body>
</html>
