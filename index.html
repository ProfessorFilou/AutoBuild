<style>

<script>

const fit=()=>$("st").style.transform=`scale(${Math.min(innerWidth/1600,innerHeight/900)})`;fit();addEventListener("resize",fit);
const P=e=>{let x=e.offsetWidth/2,y=e.offsetHeight/2;for(let o=e;o&&o.id!=="w";o=o.offsetParent){x+=o.offsetLeft;y+=o.offsetTop}return{x,y}};

/* ── Fenster ── */
const SUB=["Hero","Text","Button","Bild"];
const D=[

["FilouMeet","rgba(0,255,204,.12)",`<div class="mt"><div class="g4"><div class="tile nx" style="--a:#2fd8ff;--b2:#8b7bff"><i>F</i><small>Filou</small></div><div class="tile nx" style="--a:#ff6bcb;--b2:#ffd56a"><i>M</i><small>Mia</small></div><div class="tile nx" style="--a:#00ffcc;--b2:#2fd8ff"><i>J</i><small>Jonas</small></div><div class="tile nx" style="--a:#8b7bff;--b2:#ff6bcb"><i>L</i><small>Lea</small></div></div><div class="ctl"><span class="rb" id="mic">🎤</span><span class="rb">📷</span><span class="rb" id="scs">🖥</span><span class="rb red">✕</span></div></div>`],

["Overcharge","rgba(255,159,28,.14)",`<canvas id="ov" width="900" height="520"></canvas><div class="pill" id="ost">▶ START</div>`]
];
const wins=[],W=$("w");
D.forEach(([t,g,h],i)=>{const e=document.createElement("div");e.className="win dm";e.style.cssText=`left:${i%3*1150}px;top:${Math.floor(i/3)*800}px;--g:${g}`;e.innerHTML=`<div class="wb"><i></i><i></i><i></i><span>${t}</span></div><div class="bd">${h}</div>`;W.append(e);wins.push(e)});
W.insertAdjacentHTML("beforeend",`<canvas id="fx" width="1400" height="900"></canvas><div id="cu"><svg viewBox="0 0 24 24"><path d="M5.5 3.5V18.5L10 14L13.5 21L16 20L12.5 13H19Z" fill="#fff" stroke="#0a0d14" stroke-width="1.2" stroke-linejoin="round"/></svg></div>`);
const q=(i,s)=>wins[i].querySelector(s),qa=(i,s)=>[...wins[i].querySelectorAll(s)];

/* ── Kamera (Feder) ── */
const K=["x","y","s","rx","ry","rz"],z6=()=>({x:1600,y:1080,s:.38,rx:0,ry:0,rz:0}),cam={c:z6(),v:{x:0,y:0,s:0,rx:0,ry:0,rz:0},t:z6()};

function fly(i){const[rx,ry,rz]=POSE[i],wx=i%3*1150,wy=Math.floor(i/3)*800;go(wx+450,wy+365,1.22,rx,ry,rz);fxO={x:wx-250,y:wy-170};$("fx").style.left=fxO.x+"px";$("fx").style.top=fxO.y+"px";wins.forEach((e,j)=>e.classList.toggle("dm",j!==i));place(wx-140,wy+520)}

/* ── Hintergrund: Parallax + Lichtlinie ── */
const bc=$("bgc"),bg=bc.getContext("2d"),PT=[...Array(110)].map(()=>({x:rn(4000),y:rn(3000),z:.15+rn(.85),r:.5+rn(1.8)}));
const rsz=()=>{bc.width=innerWidth;bc.height=innerHeight};rsz();addEventListener("resize",rsz);
let lb=1,lbY=.5,lbA=1,time=0,last=performance.now(),ovOn=false,ovT=0,vals={};
function drawBg(){

  const gr=bg.createRadialGradient(Wd*.5,H*.45,50,Wd*.5,H*.5,Math.max(Wd,H)*.7);gr.addColorStop(0,"#0b1020");gr.addColorStop(1,"#03050a");bg.fillStyle=gr;bg.fillRect(0,0,Wd,H);
  for(const p of PT){const x=(((p.x-cam.c.x*p.z*.5)%Wd)+Wd)%Wd,y=(((p.y-cam.c.y*p.z*.5)%H)+H)%H;bg.fillStyle=`rgba(${p.z>.6?"0,255,204":"139,123,255"},${.15+p.z*.35})`;bg.beginPath();bg.arc(x,y,p.r*p.z+.3,0,7);bg.fill()}
  if(lb>.01){bg.save();bg.globalAlpha=lb;bg.lineWidth=3;bg.lineCap="round";
    [[0,"#00ffcc"],[1.8,"#2fd8ff"],[3.4,"#8b7bff"],[5,"#ff6bcb"]].forEach(([o,c])=>{bg.beginPath();bg.strokeStyle=c;bg.shadowColor=c;bg.shadowBlur=22;
      for(let x=Wd*.12;x<=Wd*.88;x+=6){const u=(x-Wd*.12)/(Wd*.76),env=Math.pow(Math.sin(Math.PI*u),2),y=H*lbY+Math.sin(u*9+time*3+o)*lbA*34*env+Math.sin(u*17-time*2+o)*lbA*10*env;x===Wd*.12?bg.moveTo(x,y):bg.lineTo(x,y)}bg.stroke()});bg.restore()}
}

/* ── Cursor ── */
const cu=$("cu"),fg=$("fx").getContext("2d");let pos={x:0,y:0},pts=[],tilt=0;
const place=(x,y)=>{pos={x,y};cu.style.transform=`translate(${x-5}px,${y-3}px) rotate(${tilt}deg)`};
const frame=()=>new Promise(r=>requestAnimationFrame(r)),ease=t=>t*t*t*(t*(6*t-15)+10);
async function glide(x,y,d,mv){
  const f={...pos},dx=x-f.x,dy=y-f.y,D=Math.hypot(dx,dy);if(D<2)return;
  const ux=dx/D,uy=dy/D,nx=-uy,ny=ux,sg=Math.random()<.5?-1:1,dur=d||Math.min(1500,520+D*1.1),a1=Math.min(170,D*.3)*sg,a2=-Math.min(90,D*.16)*sg;
  const c1={x:f.x+dx*.3+nx*a1,y:f.y+dy*.3+ny*a1},c2={x:f.x+dx*.75+nx*a2,y:f.y+dy*.75+ny*a2},t0=performance.now();let lx=f.x;
