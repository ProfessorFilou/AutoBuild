#fx{position:absolute;left:0;top:0;pointer-events:none;z-index:19}
.rip{position:absolute;z-index:19;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid #00ffcc;animation:rip .7s ease-out forwards}@keyframes rip{to{transform:scale(5);opacity:0}}
#cap{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50;text-align:center;padding:0 8vw}
#cap.low{align-items:end;padding-bottom:13vh}
#cap span{font:700 clamp(28px,6vw,84px)/1.1 'Space Grotesk',Inter,sans-serif;letter-spacing:-.02em;background:linear-gradient(100deg,#fff,#00ffcc 55%,#8b7bff);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;filter:blur(20px);transform:scale(1.07);transition:all 1.2s cubic-bezier(.2,.8,.2,1)}
#cap span.on{opacity:1;filter:none;transform:none}
.lbx{position:fixed;left:0;right:0;height:0;background:#000;z-index:60;transition:height 1.6s cubic-bezier(.6,0,.2,1)}.lbx.t{top:0}.lbx.b{bottom:0}
body.lb .lbx{height:7vh}
#again{display:none;position:fixed;bottom:10vh;left:50%;transform:translateX(-50%);z-index:70;padding:11px 22px;border-radius:99px;border:1px solid var(--c);background:rgba(6,8,16,.9);color:var(--c);font-weight:600;cursor:pointer}
</style></head><body>

<script>
const $=i=>document.getElementById(i),sl=ms=>new Promise(r=>setTimeout(r,ms)),rn=n=>Math.random()*n,cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${n}"/></svg>`;
$("socials").innerHTML=["github","discord","youtube","twitch"].map(s=>`<div class="social nx">${ico(s)}</div>`).join("");
$("grid").innerHTML=[["probuilder","ProBuilder"],["chat","Chat"],["click","Click"],["quiz","Quiz"],["pong","Pong"],["terminal","Terminal"],["radio","Radio"],["convert","Convert"]].map(([i,l])=>`<div class="pb nx">${ico(i)}<span>${l}</span></div>`).join("");
$("stats").innerHTML=[["1.337","Besuche gesamt"],["42 Tage","Seite online"]].map(([v,l])=>`<div class="stat nx"><b>${v}</b><small>${l}</small></div>`).join("");
document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=`<b class="v"></b><b class="gh">${e.dataset.t}</b>`);
const fit=()=>$("st").style.transform=`scale(${Math.min(innerWidth/1600,innerHeight/900)})`;fit();addEventListener("resize",fit);

/* ── Kamera: Feder-Dämpfer = weiche Fahrten ── */
const K=["x","y","s","rx","ry"],cam={c:{x:800,y:450,s:.5,rx:0,ry:0},v:{x:0,y:0,s:0,rx:0,ry:0},t:{x:800,y:450,s:.5,rx:0,ry:0}};
const go=(x,y,s,rx=0,ry=0)=>cam.t={x,y,s,rx,ry};
let last=performance.now();
(function L(n){const dt=Math.min(.05,(n-last)/1e3);last=n;
  K.forEach(k=>{cam.v[k]+=(9*(cam.t[k]-cam.c[k])-6*cam.v[k])*dt;cam.c[k]+=cam.v[k]*dt});
  const c=cam.c;$("cam").style.transform=`translate(800px,450px) rotateX(${c.rx}deg) rotateY(${c.ry}deg) scale(${c.s}) translate(${-c.x}px,${-c.y}px)`;
  requestAnimationFrame(L)})(last);

/* ── Cursor: runde Bögen + Schweif ── */
const cur=$("cur"),g=$("fx").getContext("2d");let pos={x:1750,y:1000},pts=[],tilt=0;
const place=(x,y)=>{pos={x,y};cur.style.transform=`translate(${x-5}px,${y-3}px) rotate(${tilt}deg)`};
const frame=()=>new Promise(r=>requestAnimationFrame(r)),ease=t=>t*t*t*(t*(6*t-15)+10);
(function T(n){g.clearRect(0,0,1600,900);pts=pts.filter(p=>n-p.t<520);g.lineCap="round";g.shadowBlur=16;g.shadowColor="rgba(0,255,204,.9)";
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],k=1-(n-b.t)/520;g.strokeStyle=`rgba(${k>.55?"0,255,204":"139,123,255"},${k*.55})`;g.lineWidth=1+k*7;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
  requestAnimationFrame(T)})(performance.now());
async function glide(x,y,d){
  const f={...pos},dx=x-f.x,dy=y-f.y,D=Math.hypot(dx,dy);if(D<2)return;
  const ux=dx/D,uy=dy/D,nx=-uy,ny=ux,sg=Math.random()<.5?-1:1,dur=d||Math.min(1900,700+D*1.3);
  const a1=Math.min(260,D*.38)*sg,a2=-Math.min(120,D*.18)*sg;
  const c1={x:f.x+dx*.3+nx*a1,y:f.y+dy*.3+ny*a1},c2={x:f.x+dx*.75+nx*a2,y:f.y+dy*.75+ny*a2};
  const t0=performance.now();let lx=f.x;
  await new Promise(res=>{(function s(n){const t=Math.min(1,(n-t0)/dur),e=ease(t),u=1-e;
    const X=u*u*u*f.x+3*u*u*e*c1.x+3*u*e*e*c2.x+e*e*e*x,Y=u*u*u*f.y+3*u*u*e*c1.y+3*u*e*e*c2.y+e*e*e*y;
    tilt+=(cl((X-lx)*1.6,-16,16)-tilt)*.15;lx=X;place(X,Y);pts.push({x:X,y:Y,t:n});t<1?requestAnimationFrame(s):res()})(t0)});
  for(let i=1;i<=20;i++){const k=i/20,o=Math.sin(k*Math.PI)*(1-k)*6;tilt*=.8;place(x+ux*o,y+uy*o);await frame()}
  tilt=0;place(x,y);
}
async function click(){const r=document.createElement("div");r.className="rip";r.style.left=pos.x+"px";r.style.top=pos.y+"px";$("cam").append(r);setTimeout(()=>r.remove(),700);cur.classList.add("dn");await sl(140);cur.classList.remove("dn");await sl(90)}
const P=e=>{let x=e.offsetWidth/2,y=e.offsetHeight/2;for(let o=e;o&&o.id!=="cam";o=o.offsetParent){x+=o.offsetLeft;y+=o.offsetTop}return{x,y}};
const toEl=(e,j=18)=>{const p=P(e);return glide(p.x+rn(j)-j/2,p.y+rn(j)-j/2)};
/* Kamera + Cursor gleichzeitig auf ein Element */
const F=(e,s,rx=-2,ry=-7)=>{const p=P(e);go(p.x,p.y,s,rx,ry);return glide(p.x+rn(40)-20,p.y+rn(24)-12)};

/* ── Terminal / Browser Helfer ── */
const tm=$("tb");
function ln(h,c=""){const d=document.createElement("div");d.className="l "+c;d.innerHTML=h;tm.append(d);tm.scrollTop=1e5;return d}
async function ty(el,t,sp=24){el.classList.add("cr");for(let i=1;i<=t.length;i++){el.textContent=t.slice(0,i);await sl(sp+rn(sp))}el.classList.remove("cr")}
async function typ(el,sp=26){const v=el.querySelector(".v"),h=el.querySelector(".gh"),f=el.dataset.t;for(let i=1;i<=f.length;i++){v.textContent=f.slice(0,i);h.textContent=f.slice(i);await sl(sp+rn(sp))}}
const rv=e=>{e.classList.remove("nx");e.classList.add("rv","fl");setTimeout(()=>e.classList.remove("fl"),1000)};
async function cap(t,hold,low,keep){const c=$("cap");c.className=low?"low":"";c.innerHTML=`<span>${t}</span>`;await sl(60);c.firstChild.classList.add("on");await sl(hold);if(!keep){c.firstChild.classList.remove("on");await sl(1000)}}
async function step(file,lines,act){
  go(300,430,1.3,2,9);await sl(900);
  const th=ln('<b class="or sp">✻</b> Denke nach …'),G="✻✽✶✳✢";let i=0;const iv=setInterval(()=>th.firstChild.textContent=G[i++%5],110);
  await sl(900);clearInterval(iv);th.className="l dm";th.textContent="✻ Gedacht für 1s";
  ln(`<b class="gr">●</b> <b>Write</b>(<span class="dm">${file}</span>)`);ln(`  ⎿ ${lines.length*7+3} Zeilen geschrieben`,"dm");
  for(const l of lines){const d=ln("","df");d.textContent="    "+l;await sl(190)}
  await act();
}

/* ── Drehbuch ── */
async function main(){
  document.body.classList.add("lb");
  await sl(900);await cap("Stell dir vor …",1500);await cap("Du sagst, was du willst.",1600);await cap("Und deine Website baut sich selbst.",1900);
  $("st").style.opacity=1;go(300,430,1.3,2,9);await sl(2600);
  cur.style.opacity=1;await glide(P($("pbx")).x+120,P($("pbx")).y,2000);await click();
  const txt="Bau mir meine Homepage – Glas-Look, leuchtende Orbs, Projekt-Kacheln.";
  await ty($("pt"),txt,32);await sl(500);await click();
  ln("&gt; "+txt,"u");$("pt").textContent="";await sl(400);

  await step("orbs.css",["+ .orb { filter: blur(70px); }","+ mix-blend-mode: screen;","+ background: radial-gradient(…);"],async()=>{
