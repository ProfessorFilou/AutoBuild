<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder – ProfessorFilou</title>
<link rel="icon" href="../ProfessorFilouLOGO.jpg">
<style>
:root{--bg:#060810;--glass:rgba(255,255,255,.045);--border:rgba(255,255,255,.09);--cyan:#00ffcc;--text:#f2f5f9;--dim:#9099ac;--faint:#525a6a}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding:10px;gap:8px}
.top{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--glass);border:1px solid var(--border);border-radius:14px;font-size:12px;color:var(--dim)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
#status{margin-left:auto;color:var(--cyan);font-variant-numeric:tabular-nums}
.main{flex:1;display:flex;gap:8px;min-height:0}
.side{width:76px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;gap:9px;align-items:center;font-size:10px;color:var(--dim)}
.side small{letter-spacing:1px;text-transform:uppercase}
.sw{width:30px;height:30px;border-radius:9px;border:2px solid transparent;transition:.2s}
.sw.sel{border-color:#fff;transform:scale(1.2);box-shadow:0 0 14px currentColor}
#hex{font-family:monospace;color:var(--text);margin-top:2px}
.stage{position:relative;flex:1;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:screen;opacity:0;transition:opacity 1.8s}
#pg{position:relative;z-index:1;transform-origin:top left;padding:24px 14px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.nx{visibility:hidden}
.pop{animation:pop .4s cubic-bezier(.25,1.4,.5,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.v{font-weight:inherit}.gh{visibility:hidden;font-weight:inherit}
.caret .v::after{content:"";display:inline-block;width:2px;height:1em;background:#fff;margin-left:2px;vertical-align:-.12em;animation:bl .5s steps(1) infinite;-webkit-text-fill-color:initial}
@keyframes bl{50%{opacity:0}}
h1{display:flex;align-items:center;justify-content:center;white-space:pre;font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:clamp(30px,8vw,76px);line-height:1.1;padding:0 8px}
h1 span{color:#fff;-webkit-background-clip:text;background-clip:text}
#bot{width:.95em;height:.95em;border-radius:50%;background:#2fd8ff;position:relative;flex-shrink:0;margin:0 -.02em;transition:background .6s}
#bot i{position:absolute;top:34%;width:15%;height:30%;border-radius:8px;background:#000;transition:height .15s,top .15s}
#bot i:nth-child(1){left:24%}#bot i:nth-child(2){right:24%}
#bot.happy i{height:12%;top:42%}
.line{width:min(220px,60vw);height:1px;margin:18px auto;background:#2a3040;transition:background .8s}
.txt{color:var(--dim);font-size:clamp(14px,3.3vw,18px);transition:color .6s}
.socials{display:flex;gap:12px;margin-top:22px}
.social{width:clamp(48px,11vw,60px);height:clamp(48px,11vw,60px);border-radius:16px;background:var(--glass);border:1px solid var(--border);display:grid;place-items:center;color:var(--text);transition:color .6s}
.social svg{width:44%;height:44%}
.ptr{margin-top:36px;display:flex;align-items:center;gap:12px}
.ptitle{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:clamp(19px,4.4vw,27px)}
.dice{width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--glass);display:grid;place-items:center;color:var(--text);transition:color .6s}
.dice svg{width:19px;height:19px}
.grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:100%;max-width:900px}
.pb{padding:16px 10px 13px;border-radius:20px;background:var(--glass);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--text);transition:color .6s}
.pb svg{width:26px;height:26px;color:var(--dim);transition:color .5s,opacity .3s;opacity:0}
.pb.ic svg{opacity:1}
.pb svg *,.social svg *{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s ease}
.pb.ic svg *,.social.ic svg *{stroke-dashoffset:0}
.social svg{opacity:0;transition:opacity .3s}.social.ic svg{opacity:1}
.links,.copy{font-size:13px;color:var(--faint)}
.links{margin-top:28px}.copy{margin-top:10px}
.stats{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{padding:12px 16px;min-width:150px;border-radius:16px;background:var(--glass);border:1px solid var(--border);text-align:left}
.stat b{display:block;font-family:'Space Grotesk',Inter,sans-serif;font-size:16px}
.stat small{font-size:11px;color:var(--faint)}
.cur{position:fixed;left:0;top:0;z-index:50;pointer-events:none;transition:transform .7s cubic-bezier(.45,.05,.2,1)}
.cur svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.cur.click svg{animation:ck .17s}
@keyframes ck{50%{transform:scale(.7)}}
.sel{position:fixed;z-index:40;border:1.5px solid;pointer-events:none;transition:width .7s cubic-bezier(.45,.05,.2,1),height .7s cubic-bezier(.45,.05,.2,1),opacity .4s;background:rgba(255,255,255,.04)}
.sel i{position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid;border-color:inherit}
.sel i:nth-child(1){left:-4px;top:-4px}.sel i:nth-child(2){right:-4px;top:-4px}.sel i:nth-child(3){left:-4px;bottom:-4px}.sel i:nth-child(4){right:-4px;bottom:-4px}
.sel em{position:absolute;left:0;top:100%;margin-top:7px;font:600 10px monospace;padding:2px 6px;border-radius:5px;color:#050505;font-style:normal;white-space:nowrap}
#again{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;padding:11px 22px;border-radius:999px;border:1px solid var(--cyan);background:rgba(6,8,16,.9);color:var(--cyan);font-weight:600;cursor:pointer}
#again.show{display:block}
</style>
</head>
<body>
<svg style="display:none"><defs>
<g id="i-github"><path d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.8 9.6.5.1.7-.2.7-.5v-1.9c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1.1 1.5 1.1.9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.3-.3-4.6-1.1-4.6-5.1 0-1.1.4-2 1.1-2.8-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 2.9 1.1a10 10 0 0 1 5.3 0c2-1.4 2.9-1.1 2.9-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.7 1.1 2.8 0 4-2.3 4.8-4.6 5.1.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10.1 10.1 0 0 0 22 12.2C22 6.6 17.5 2 12 2Z"/></g>
<g id="i-discord"><path d="M19.3 5.2A16.6 16.6 0 0 0 15.1 4l-.3.6a14.5 14.5 0 0 1 3.5 1.4 15 15 0 0 0-13.2 0A14.5 14.5 0 0 1 8.6 4.6L8.3 4a16.6 16.6 0 0 0-4.2 1.2C1.7 9.3.9 13.3 1.2 17.2a16.7 16.7 0 0 0 5.1 2.6l.7-1.1a10.8 10.8 0 0 1-1.7-.8l.4-.3a12 12 0 0 0 10.6 0l.4.3c-.5.3-1.1.6-1.7.8l.7 1.1a16.7 16.7 0 0 0 5.1-2.6c.4-4.4-.6-8.3-2.5-12z"/></g>
<g id="i-youtube"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5l5 2.5-5 2.5Z"/></g>
<g id="i-twitch"><path d="M5 3 3.5 6.5v13H8V22l3-2.5h4L19.5 15V3Z"/><line x1="12.5" y1="7.5" x2="12.5" y2="12.5"/><line x1="16.5" y1="7.5" x2="16.5" y2="12.5"/></g>
<g id="i-probuilder"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>
<g id="i-chat"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H9l-4.5 4v-4H4A1.5 1.5 0 0 1 2.5 15V7A1.5 1.5 0 0 1 4 5.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></g>
<g id="i-click"><circle cx="12" cy="12" r="9"/><path d="M8.5 10h.01M15.5 10h.01"/><path d="M7.5 14.5c1 1.6 2.7 2.5 4.5 2.5s3.5-.9 4.5-2.5"/></g>
<g id="i-quiz"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 1 1 3.7 2.2c-.9.5-1.2 1-1.2 2"/><path d="M12 17h.01"/></g>
<g id="i-pong"><rect x="2.5" y="4" width="19" height="16" rx="2"/><line x1="6" y1="9" x2="6" y2="13"/><line x1="18" y1="11" x2="18" y2="15"/><path d="M12 12h.01"/></g>
<g id="i-terminal"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M6.5 9.5l3 2.5-3 2.5"/><line x1="11.5" y1="14.5" x2="16" y2="14.5"/></g>
<g id="i-radio"><circle cx="12" cy="14" r="2"/><path d="M8.5 10.5a5 5 0 0 1 7 0"/><path d="M6 8a8.5 8.5 0 0 1 12 0"/><path d="M3.5 5.5a12 12 0 0 1 17 0"/></g>
<g id="i-convert"><path d="M4 4h7v7H4z"/><path d="M13 13h7v7h-7z"/><path d="M9 7h6M15 7l-2-2M15 7l-2 2"/><path d="M15 17H9M9 17l2 2M9 17l2-2"/></g>
</defs></svg>
<div class="app">
  <div class="top"><span class="dots"><i></i><i></i><i></i></span><span>editor · professorfilou.de</span><span id="status"></span></div>
  <div class="main">
    <div class="side"><small>Farbe</small><div id="pal" style="display:flex;flex-direction:column;gap:9px"></div><div id="hex">–</div></div>
    <div class="stage" id="stage">
      <div class="orb nx" id="o1" style="width:44%;height:60%;left:-10%;top:-14%"></div>
      <div class="orb nx" id="o2" style="width:38%;height:55%;right:-12%;top:10%"></div>
      <div class="orb nx" id="o3" style="width:40%;height:55%;left:20%;bottom:-18%"></div>
      <div id="pg">
        <h1><span id="s1" class="nx" data-t="Profess"></span><div id="bot" class="nx"><i></i><i></i></div><span id="s2" class="nx" data-t="rFilou"></span></h1>
        <div class="line nx" id="line"></div>
        <div class="txt nx" id="mc" data-t="❤️ Minecraft"></div>
        <div class="socials" id="socials"></div>
        <div class="ptr"><div class="ptitle nx" id="pt" data-t="My Projects"></div><div class="dice nx" id="dice"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.8"/><circle cx="8.2" cy="8.2" r="1.35" fill="currentColor"/><circle cx="15.8" cy="8.2" r="1.35" fill="currentColor"/><circle cx="12" cy="12" r="1.35" fill="currentColor"/><circle cx="8.2" cy="15.8" r="1.35" fill="currentColor"/><circle cx="15.8" cy="15.8" r="1.35" fill="currentColor"/></svg></div></div>
        <div class="grid" id="grid"></div>
        <div class="links nx" id="links" data-t="Kontakt  ·  Impressum"></div>
        <div class="copy nx" id="copy" data-t="© ProfessorFilou"></div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
</div>
<button id="again" type="button">↻ Nochmal bauen</button>

<script>
const C={cyan:"#00ffcc",blue:"#2fd8ff",violet:"#8b7bff",pink:"#ff6bcb",gold:"#ffd56a",white:"#f2f5f9",gray:"#9099ac"};
const CC=["#00ffcc","#ff6bcb","#ffd56a","#8b7bff","#2fd8ff","#ff9f43","#66ff99","#ff5566"];
const SOC=["github","discord","youtube","twitch"];
const PROJ=[["probuilder","ProBuilder"],["chat","Chat"],["click","Click"],["quiz","Quiz"],["pong","Pong"],["terminal","Terminal"],["radio","Radio"],["convert","Convert"]];
const STAT=[["1.337","Besuche gesamt"],["42 Tage","Seite online"]];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n;
const stage=$("stage"),pg=$("pg"),pal=$("pal");
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${n}"/></svg>`;
let run=0,done=0,total=0,ncur=0;

function prepText(el){el.innerHTML=`<b class="v"></b><b class="gh">${el.dataset.t}</b>`}
function init(){
  pal.innerHTML=[C.cyan,C.blue,C.violet,C.pink,C.gold,C.white,C.gray].map(c=>`<div class="sw" style="background:${c};color:${c}" data-c="${c}"></div>`).join("");
  $("hex").textContent="–";
  ["o1","o2","o3"].forEach(i=>{const o=$(i);o.className="orb nx";o.style.opacity=0;o.style.background=""});
  ["s1","s2","bot","line","mc","pt","dice","links","copy"].forEach(i=>{const e=$(i);e.className=e.className.replace(/\b(pop|happy|ic)\b/g,"").trim();if(!/nx/.test(e.className))e.className+=" nx"});
  ["s1","s2"].forEach(i=>{const e=$(i);e.style.backgroundImage="";e.style.webkitTextFillColor=""});
  $("bot").style.background="#2a3040";$("line").style.background="";
  ["mc","dice","pt","links","copy"].forEach(i=>$(i).style.color="");
  document.querySelectorAll("[data-t]").forEach(prepText);
  $("socials").innerHTML=SOC.map(s=>`<a class="social nx">${ico(s)}</a>`).join("");
  $("grid").innerHTML=PROJ.map(([i,l])=>`<div class="pb nx">${ico(i)}<span data-t="${l}"></span></div>`).join("");
  $("stats").innerHTML=STAT.map(([v,l])=>`<div class="stat nx"><b data-t="${v}"></b><small>${l}</small></div>`).join("");
  document.querySelectorAll(".grid [data-t],.stats [data-t]").forEach(prepText);
  document.querySelectorAll(".pb svg *,.social svg *").forEach(e=>e.setAttribute("pathLength","1"));
}
function fit(){
  pg.style.width="100%";pg.style.transform="none";
  const s=Math.min(1,(stage.clientHeight-8)/pg.offsetHeight);
  pg.style.width=(100/s)+"%";pg.style.transform=`scale(${s})`;
}
addEventListener("resize",fit);

function mkCursor(i){
  const c=document.createElement("div");c.className="cur";c.col=CC[i%CC.length];
  c.innerHTML=`<svg viewBox="0 0 24 24"><path d="M5.5 3.5V18.5L10 14L13.5 21L16 20L12.5 13H19Z" fill="${c.col}" stroke="#050505" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  c.style.transition="none";
  c.style.transform=`translate(${Math.random()<.5?-40:innerWidth+40}px,${rnd(innerHeight)}px)`;
  document.body.append(c);requestAnimationFrame(()=>c.style.transition="");
  return c;
}
async function move(c,x,y,d=700){c.style.transitionDuration=d+"ms";c.style.transform=`translate(${x-5}px,${y-3}px)`;await sleep(d+60)}
async function go(c,el){const b=el.getBoundingClientRect();await move(c,b.left+b.width*(.2+rnd(.6)),b.top+b.height*(.2+rnd(.6)),600+rnd(250))}
async function click(c){c.classList.add("click");await sleep(170);c.classList.remove("click")}
async function pick(c,hex){
  const sw=[...pal.children].find(s=>s.dataset.c===hex);
  await go(c,sw);await click(c);
  [...pal.children].forEach(x=>x.classList.remove("sel"));sw.classList.add("sel");$("hex").textContent=hex;
}
async function type(el){
  const v=el.querySelector(".v"),g=el.querySelector(".gh"),full=el.dataset.t;
  el.classList.add("caret");
  for(let i=1;i<=full.length;i++){v.textContent=full.slice(0,i);g.textContent=full.slice(i);await sleep(32+rnd(55))}
  el.classList.remove("caret");
}
function clip(r){const s=stage.getBoundingClientRect();
  const l=Math.max(r.left,s.left),t=Math.max(r.top,s.top);
  return{l,t,r:Math.min(r.right,s.right),b:Math.min(r.bottom,s.bottom)}}
async function draw(c,el,round){
  const k=clip(el.getBoundingClientRect());
  await move(c,k.l,k.t,600+rnd(250));await click(c);
  const s=document.createElement("div");s.className="sel";
  s.style.cssText=`left:${k.l}px;top:${k.t}px;width:0;height:0;border-color:${c.col};${round?"border-radius:50%":""}`;
  s.innerHTML=`<i></i><i></i><i></i><i></i><em style="background:${c.col}">0 × 0</em>`;
  document.body.append(s);await sleep(40);
  s.style.width=(k.r-k.l)+"px";s.style.height=(k.b-k.t)+"px";
  const lab=s.querySelector("em"),t0=performance.now();
  (function tick(){const b=s.getBoundingClientRect();lab.textContent=Math.round(b.width)+" × "+Math.round(b.height);if(performance.now()-t0<780)requestAnimationFrame(tick)})();
  await move(c,k.r,k.b,700);
  return s;
}
const reveal=el=>{el.classList.remove("nx");el.classList.add("pop")};
async function build(c,el,o={}){
  const s=await draw(c,el,o.round);
  if(!o.hold)reveal(el);
  if(o.col){await pick(c,o.col);await go(c,el);await click(c);o.apply&&o.apply(el,o.col)}
  if(o.ic){el.classList.add("ic")}
  if(el.dataset.t)await type(el);
  await sleep(250);s.style.opacity=0;setTimeout(()=>s.remove(),450);
  status(++done);
}
function status(n){$("status").textContent=n+" / "+total+" Elemente · "+ncur+" Cursor"}
const grad=(a,b)=>el=>{el.style.backgroundImage=`linear-gradient(100deg,${a},${b})`;el.style.webkitTextFillColor="transparent"};

function tasks(){
  const T=[],B=(el,o)=>T.push(c=>build(c,el,o));
  [["o1",C.cyan],["o2",C.violet],["o3",C.blue]].forEach(([id,col])=>B($(id),{round:1,hold:1,col,apply:o=>{o.classList.remove("nx");o.style.background=`radial-gradient(circle,${col},transparent 70%)`;o.style.opacity=.32}}));
  B($("s1"),{col:C.cyan,apply:(e)=>grad(C.cyan,C.blue)(e)});
  B($("bot"),{round:1,col:C.blue,apply:(e,c)=>e.style.background=c});
  B($("s2"),{col:C.violet,apply:(e)=>grad(C.violet,C.pink)(e)});
  B($("line"),{col:C.cyan,apply:e=>e.style.background=`linear-gradient(90deg,transparent,${C.cyan},transparent)`});
  B($("mc"),{col:C.gray,apply:(e,c)=>e.style.color=c});
  [...$("socials").children].forEach(e=>B(e,{col:C.gray,ic:1,apply:(x,c)=>x.style.color=c}));
  B($("pt"),{col:C.white,apply:(e,c)=>e.style.color=c});
  B($("dice"),{col:C.cyan,apply:(e,c)=>e.style.color=c});
  [...$("grid").children].forEach(e=>B(e,{col:C.cyan,ic:1,apply:(x,c)=>x.querySelector("svg").style.color=c}));
  B($("links"),{col:C.gray,apply:(e,c)=>e.style.color=c});
  B($("copy"),{col:C.gray,apply:(e,c)=>e.style.color=c});
  [...$("stats").children].forEach(e=>B(e,{col:C.cyan,apply:(x,c)=>x.querySelector("b").style.color=c}));
  return T;
}

async function start(){
  const id=++run;
  document.querySelectorAll(".cur,.sel").forEach(e=>e.remove());
  $("again").classList.remove("show");
  init();fit();done=0;
  const q=tasks();total=q.length;
  ncur=innerWidth<600?7:12;status(0);
  const cs=Array.from({length:ncur},(_,i)=>mkCursor(i));
  await sleep(500);
  await Promise.all(cs.map(async(c,i)=>{
    await sleep(i*220);
    while(q.length&&id===run){await q.shift()(c);await sleep(100+rnd(250))}
  }));
  if(id!==run)return;
  const bot=$("bot"),b=bot.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
  await Promise.all(cs.map((c,i)=>move(c,cx+Math.cos(i)*70,cy+Math.sin(i)*70,900)));
  bot.classList.add("happy");
  for(let k=0;k<10;k++){
    await Promise.all(cs.map((c,i)=>{const a=k*.7+i*6.283/cs.length;return move(c,cx+Math.cos(a)*90,cy+Math.sin(a)*90,300)}));
  }
  bot.classList.remove("happy");
  cs.forEach((c,i)=>{c.style.transitionDuration="900ms";c.style.transform=`translate(${i%2?innerWidth+60:-60}px,${rnd(innerHeight)}px)`});
  $("status").textContent="Fertig ✓";
  $("again").classList.add("show");
}
$("again").onclick=start;
start();
</script>
</body>
