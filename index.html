<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builder – ProfessorFilou</title>
<link rel="icon" href="../ProfessorFilouLOGO.jpg">
<style>
:root{--bg:#060810;--glass:rgba(255,255,255,.045);--border:rgba(255,255,255,.09);--cyan:#00ffcc;--text:#f2f5f9;--dim:#9099ac;--faint:#525a6a}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding:10px;gap:8px}
.top{display:flex;align-items:center;gap:10px;padding:7px 14px;background:var(--glass);border:1px solid var(--border);border-radius:14px;font-size:12px;color:var(--dim)}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
#status{margin-left:auto;color:var(--cyan)}
.main{flex:1;display:flex;gap:8px;min-height:0}
.side{width:64px;background:var(--glass);border:1px solid var(--border);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;gap:9px;align-items:center}
.side small{font-size:9px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.sw{width:30px;height:30px;border-radius:9px;border:2px solid transparent;transition:.2s}
.sw.sel{border-color:#fff;transform:scale(1.2);box-shadow:0 0 14px currentColor}
.stage{position:relative;flex:1;border:1px solid var(--border);border-radius:14px;overflow-y:auto;overflow-x:hidden;background:var(--bg);scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:screen;opacity:0;transition:opacity 1.6s;pointer-events:none}
.page{position:relative;z-index:1;min-height:100%;padding:34px 14px 40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ph{outline:2px dashed rgba(255,255,255,.16);outline-offset:5px;opacity:.4}
.pop{animation:pop .45s cubic-bezier(.25,1.4,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.caret::after{content:"";display:inline-block;width:2px;height:1em;background:currentColor;margin-left:2px;vertical-align:-.12em;animation:bl .6s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
h1{display:flex;align-items:center;justify-content:center;white-space:pre;font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:clamp(30px,8vw,76px);line-height:1.1;min-height:1.1em;padding:0 8px}
h1 span{color:#fff;-webkit-background-clip:text;background-clip:text}
#bot{width:.95em;height:.95em;border-radius:50%;background:#2a3040;position:relative;flex-shrink:0;margin:0 -.02em}
#bot i{position:absolute;top:34%;width:15%;height:30%;border-radius:8px;background:#000;transition:height .15s}
#bot i:nth-child(1){left:24%}#bot i:nth-child(2){right:24%}
#bot.happy i{height:12%;top:42%}
.line{width:min(220px,60vw);height:1px;margin:18px auto;background:linear-gradient(90deg,transparent,#2a3040,transparent)}
.txt{color:var(--dim);font-size:clamp(14px,3.3vw,18px);min-height:1.4em;min-width:90px}
.socials{display:flex;gap:12px;margin-top:22px}
.social{width:clamp(48px,11vw,60px);height:clamp(48px,11vw,60px);border-radius:16px;background:var(--glass);border:1px solid var(--border);display:grid;place-items:center;color:var(--dim);transition:color .5s,border-color .5s}
.social svg{width:44%;height:44%}
.ptr{margin-top:40px;display:flex;align-items:center;gap:12px}
.ptitle{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:clamp(19px,4.4vw,27px);min-width:120px;min-height:1.3em}
.dice{width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--glass);display:grid;place-items:center;color:var(--faint);transition:color .5s}
.dice svg{width:19px;height:19px}
.grid{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:100%;max-width:900px}
.pb{padding:16px 10px 13px;border-radius:20px;background:var(--glass);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:9px;font-size:14px;font-weight:500;transition:border-color .5s,color .5s;min-height:78px}
.pb svg{width:26px;height:26px;color:var(--dim);transition:color .5s,filter .5s}
.pb span{min-height:1.2em}
.links{margin-top:34px;font-size:13px;color:var(--faint);min-height:1.2em}
.copy{margin-top:12px;font-size:13px;color:var(--faint);min-height:1.2em;min-width:100px}
.stats{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat{padding:12px 16px;min-width:150px;border-radius:16px;background:var(--glass);border:1px solid var(--border);text-align:left}
.stat b{display:block;font-family:'Space Grotesk',Inter,sans-serif;font-size:16px;min-height:1.2em}
.stat small{font-size:11px;color:var(--faint)}
.cur{position:fixed;left:0;top:0;z-index:50;pointer-events:none;transition:transform .7s cubic-bezier(.45,.05,.2,1)}
.cur svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.cur.click svg{animation:ck .2s}
@keyframes ck{50%{transform:scale(.7)}}
#again{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;padding:11px 22px;border-radius:999px;border:1px solid var(--cyan);background:rgba(6,8,16,.9);color:var(--cyan);font-weight:600;cursor:pointer}
#again.show{display:block}
@media(prefers-reduced-motion:reduce){.cur{transition:none}}
</style>
</head>
<body>
<svg style="display:none"><defs>
<g id="i-github"><path d="M12 2C6.5 2 2 6.6 2 12.2c0 4.5 2.9 8.3 6.8 9.6.5.1.7-.2.7-.5v-1.9c-2.8.6-3.4-1.3-3.4-1.3-.4-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1.1 1.5 1.1.9 1.5 2.3 1.1 2.9.8.1-.7.4-1.1.6-1.4-2.3-.3-4.6-1.1-4.6-5.1 0-1.1.4-2 1.1-2.8-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 2.9 1.1a10 10 0 0 1 5.3 0c2-1.4 2.9-1.1 2.9-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.7 1.1 2.8 0 4-2.3 4.8-4.6 5.1.4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10.1 10.1 0 0 0 22 12.2C22 6.6 17.5 2 12 2Z" fill="currentColor" stroke="none"/></g>
<g id="i-discord"><path d="M19.3 5.2A16.6 16.6 0 0 0 15.1 4l-.3.6a14.5 14.5 0 0 1 3.5 1.4 15 15 0 0 0-13.2 0A14.5 14.5 0 0 1 8.6 4.6L8.3 4a16.6 16.6 0 0 0-4.2 1.2C1.7 9.3.9 13.3 1.2 17.2a16.7 16.7 0 0 0 5.1 2.6l.7-1.1a10.8 10.8 0 0 1-1.7-.8l.4-.3a12 12 0 0 0 10.6 0l.4.3c-.5.3-1.1.6-1.7.8l.7 1.1a16.7 16.7 0 0 0 5.1-2.6c.4-4.4-.6-8.3-2.5-12zM8.7 14.6c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8zm6.6 0c-.9 0-1.6-.8-1.6-1.8s.7-1.8 1.6-1.8 1.6.8 1.6 1.8-.7 1.8-1.6 1.8z" fill="currentColor" stroke="none"/></g>
<g id="i-youtube"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5l5 2.5-5 2.5Z" fill="currentColor" stroke="none"/></g>
<g id="i-twitch"><path d="M5 3 3.5 6.5v13H8V22l3-2.5h4L19.5 15V3Z"/><line x1="12.5" y1="7.5" x2="12.5" y2="12.5"/><line x1="16.5" y1="7.5" x2="16.5" y2="12.5"/></g>
<g id="i-probuilder"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></g>
<g id="i-chat"><path d="M4 5.5h16a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H9l-4.5 4v-4H4A1.5 1.5 0 0 1 2.5 15V7A1.5 1.5 0 0 1 4 5.5Z"/><circle cx="8" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="11" r="1" fill="currentColor" stroke="none"/></g>
<g id="i-click"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="10" r="1" fill="currentColor" stroke="none"/><path d="M7.5 14.5c1 1.6 2.7 2.5 4.5 2.5s3.5-.9 4.5-2.5"/></g>
<g id="i-quiz"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.5 2.5 0 1 1 3.7 2.2c-.9.5-1.2 1-1.2 2" stroke-linecap="round"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/></g>
<g id="i-pong"><rect x="2.5" y="4" width="19" height="16" rx="2"/><line x1="6" y1="9" x2="6" y2="13"/><line x1="18" y1="11" x2="18" y2="15"/><circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/></g>
<g id="i-terminal"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M6.5 9.5l3 2.5-3 2.5"/><line x1="11.5" y1="14.5" x2="16" y2="14.5"/></g>
<g id="i-radio"><circle cx="12" cy="14" r="2"/><path d="M8.5 10.5a5 5 0 0 1 7 0"/><path d="M6 8a8.5 8.5 0 0 1 12 0"/><path d="M3.5 5.5a12 12 0 0 1 17 0"/></g>
<g id="i-convert"><path d="M4 4h7v7H4z"/><path d="M13 13h7v7h-7z"/><path d="M9 7h6M15 7l-2-2M15 7l-2 2"/><path d="M15 17H9M9 17l2 2M9 17l2-2"/></g>
</defs></svg>

<div class="app">
  <div class="top"><span class="dots"><i></i><i></i><i></i></span><span>editor · professorfilou.de</span><span id="status"></span></div>
  <div class="main">
    <div class="side"><small>Farben</small><div id="pal" style="display:flex;flex-direction:column;gap:9px"></div></div>
    <div class="stage" id="stage">
      <div class="orb" id="o1" style="width:44%;height:60%;left:-10%;top:-14%"></div>
      <div class="orb" id="o2" style="width:38%;height:55%;right:-12%;top:10%"></div>
      <div class="orb" id="o3" style="width:40%;height:55%;left:20%;bottom:-18%"></div>
      <div class="page">
        <h1 id="h1"><span id="s1" class="ph"></span><div id="bot" class="ph"><i></i><i></i></div><span id="s2" class="ph"></span></h1>
        <div class="line ph" id="line"></div>
        <div class="txt ph" id="mc"></div>
        <div class="socials" id="socials"></div>
        <div class="ptr"><div class="ptitle ph" id="pt"></div><div class="dice ph" id="dice"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.8"/><circle cx="8.2" cy="8.2" r="1.35" fill="currentColor"/><circle cx="15.8" cy="8.2" r="1.35" fill="currentColor"/><circle cx="12" cy="12" r="1.35" fill="currentColor"/><circle cx="8.2" cy="15.8" r="1.35" fill="currentColor"/><circle cx="15.8" cy="15.8" r="1.35" fill="currentColor"/></svg></div></div>
        <div class="grid" id="grid"></div>
        <div class="links ph" id="links"></div>
        <div class="copy ph" id="copy"></div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
</div>
<button id="again" type="button">↻ Nochmal bauen</button>

<script>
const PAL=[["#00ffcc","Cyan"],["#2fd8ff","Blau"],["#8b7bff","Violett"],["#ff6bcb","Pink"],["#ffd56a","Gold"],["#f2f5f9","Weiß"],["#9099ac","Grau"]];
const C={cyan:"#00ffcc",blue:"#2fd8ff",violet:"#8b7bff",pink:"#ff6bcb",gold:"#ffd56a",white:"#f2f5f9",gray:"#9099ac"};
const SOC=["github","discord","youtube","twitch"];
const PROJ=[["probuilder","ProBuilder"],["chat","Chat"],["click","Click"],["quiz","Quiz"],["pong","Pong"],["terminal","Terminal"],["radio","Radio"],["convert","Convert"]];
const STAT=[["1.337","Besuche gesamt"],["42 Tage","Seite online"]];
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const stage=$("stage"), pal=$("pal"), status=$("status");
const ico=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><use href="#i-${n}"/></svg>`;
let run=0;

function init(){
  pal.innerHTML=PAL.map(([c])=>`<div class="sw" style="background:${c};color:${c}" data-c="${c}"></div>`).join("");
  ["o1","o2","o3"].forEach(i=>{$(i).style.opacity=0;$(i).style.background=""});
  const s1=$("s1"),s2=$("s2"),bot=$("bot");
  [s1,s2,bot,$("line"),$("mc"),$("pt"),$("dice"),$("links"),$("copy")].forEach(e=>{e.className=e.className.replace(/\b(pop|caret)\b/g,"").trim();if(!/ph/.test(e.className))e.className+=" ph"});
  s1.textContent=s2.textContent="";[s1,s2].forEach(s=>{s.style.backgroundImage="";s.style.webkitTextFillColor=""});
  bot.className="ph";bot.style.background="#2a3040";
  $("line").style.background="";$("mc").textContent="";$("pt").textContent="";$("links").textContent="";$("copy").textContent="";
  $("dice").style.color="";
  $("socials").innerHTML=SOC.map(s=>`<a class="social ph">${ico(s)}</a>`).join("");
  $("grid").innerHTML=PROJ.map(([i,l])=>`<div class="pb ph">${ico(i)}<span></span></div>`).join("");
  $("stats").innerHTML=STAT.map(([v,l])=>`<div class="stat ph"><b></b><small>${l}</small></div>`).join("");
  stage.scrollTop=0;
}

function mkCursor(i){
  const c=document.createElement("div");c.className="cur";
  const col=PAL[(i*2)%PAL.length][0];
  c.innerHTML=`<svg viewBox="0 0 24 24"><path d="M5.5 3.5V18.5L10 14L13.5 21L16 20L12.5 13H19Z" fill="${col}" stroke="#050505" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
  c.style.transition="none";
  c.style.transform=`translate(${Math.random()<.5?-40:innerWidth+40}px,${Math.random()*innerHeight}px)`;
  document.body.append(c);
  requestAnimationFrame(()=>c.style.transition="");
  return c;
}
async function go(c,el){
  const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  if(r.top<sr.top+30||r.bottom>sr.bottom-30){
    stage.scrollBy({top:r.top-sr.top-sr.height/2+r.height/2,behavior:"smooth"});await sleep(450);
  }
  const b=el.getBoundingClientRect();
  c.style.transform=`translate(${b.left+b.width*(.25+Math.random()*.5)}px,${b.top+b.height*(.25+Math.random()*.5)}px)`;
  await sleep(650+Math.random()*250);
}
async function click(c){c.classList.add("click");await sleep(170);c.classList.remove("click")}
async function pick(c,hex){
  const sw=[...pal.children].find(s=>s.dataset.c===hex);
  await go(c,sw);await click(c);
  [...pal.children].forEach(x=>x.classList.remove("sel"));sw.classList.add("sel");
  return hex;
}
async function type(el,txt){
  el.classList.add("caret");el.textContent="";
  for(const ch of txt){el.textContent+=ch;await sleep(32+Math.random()*55)}
  el.classList.remove("caret");
}
const reveal=el=>{el.classList.remove("ph");el.classList.add("pop")};
async function place(c,el){await go(c,el);await click(c);reveal(el)}

function tasks(){
  const T=[];
  [["o1",C.cyan],["o2",C.violet],["o3",C.blue]].forEach(([id,col])=>T.push(async c=>{
    const o=$(id);await go(c,o);await click(c);await pick(c,col);await go(c,o);await click(c);
    o.style.background=`radial-gradient(circle,${col},transparent 70%)`;o.style.opacity=.32}));
  T.push(async c=>{
    const s1=$("s1"),s2=$("s2"),bot=$("bot");
    await place(c,s1);const a=await pick(c,C.cyan),b=await pick(c,C.violet);
    await go(c,s1);await click(c);
    [s1,s2].forEach(s=>{s.style.backgroundImage=`linear-gradient(100deg,${a},${C.blue} 40%,${b} 75%,${C.pink})`;s.style.backgroundSize="300% auto";s.style.webkitTextFillColor="transparent"});
    await type(s1,"Profess");
    await place(c,bot);const g=await pick(c,C.cyan);await go(c,bot);await click(c);bot.style.background=g;
    await place(c,s2);await type(s2,"rFilou");
  });
  T.push(async c=>{const l=$("line");await place(c,l);await pick(c,C.cyan);await go(c,l);await click(c);l.style.background=`linear-gradient(90deg,transparent,${C.cyan},transparent)`});
  T.push(async c=>{const e=$("mc");await place(c,e);await type(e,"❤️ Minecraft")});
  [...$("socials").children].forEach(el=>T.push(async c=>{
    await place(c,el);await pick(c,C.gray);await go(c,el);await click(c);el.style.color=C.gray}));
  T.push(async c=>{const e=$("pt");await place(c,e);await type(e,"My Projects");
    const d=$("dice");await place(c,d);await pick(c,C.cyan);await go(c,d);await click(c);d.style.color=C.cyan});
  [...$("grid").children].forEach((el,i)=>T.push(async c=>{
    await place(c,el);await pick(c,C.cyan);await go(c,el);await click(c);
    el.querySelector("svg").style.color=C.cyan;
    await type(el.querySelector("span"),PROJ[i][1]);}));
  T.push(async c=>{const e=$("links");await place(c,e);await type(e,"Kontakt  ·  Impressum")});
  T.push(async c=>{const e=$("copy");await place(c,e);await type(e,"© ProfessorFilou")});
  [...$("stats").children].forEach((el,i)=>T.push(async c=>{
    await place(c,el);await pick(c,C.cyan);await go(c,el);await click(c);
    el.querySelector("b").style.color=C.cyan;await type(el.querySelector("b"),STAT[i][0])}));
  return T;
}

async function start(){
  const id=++run;
  document.querySelectorAll(".cur").forEach(e=>e.remove());
  $("again").classList.remove("show");
  init();
  const n=innerWidth<600?4:7;
  const cs=Array.from({length:n},(_,i)=>mkCursor(i));
  status.textContent=n+" Cursor aktiv";
  const q=tasks();
  await sleep(500);
  await Promise.all(cs.map(async(c,i)=>{
    await sleep(i*300);
    while(q.length&&id===run){await q.shift()(c);await sleep(120+Math.random()*250)}
  }));
  if(id!==run)return;
  stage.scrollTo({top:0,behavior:"smooth"});await sleep(600);
  const bot=$("bot");
  await Promise.all(cs.map(async(c,i)=>{await sleep(i*100);await go(c,bot)}));
  await click(cs[0]);bot.classList.add("happy");
  status.textContent="Fertig ✓";
  await sleep(1500);
  bot.classList.remove("happy");
  cs.forEach((c,i)=>c.style.transform=`translate(${i%2?innerWidth+60:-60}px,${Math.random()*innerHeight}px)`);
  $("again").classList.add("show");
}
$("again").onclick=start;
start();
</script>
</body>
</html>
